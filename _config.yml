title: Russ Shomberg, PhD
description: >-
  Marine robotics engineer at the University of Rhode Island developing
  low-cost sensing and data tools for oceanographic and polar research.
author: Russ Shomberg
email: rshomberg@uri.edu
url: https://rshom.github.io
baseurl: ""
repository: rshom/rshom.github.io
lang: en_US
logo: /assets/img/shomberg.jpg

theme: minima
github_username: rshomberg-uri
linkedin_username: rshomberg

minima:
  date_format: "%Y-%m-%d"

# Nav order. Work, Blog, and Play come back as their content is ready.
header_pages:
  - _pages/about.md
  - _pages/publications.md
  - _pages/cv.md

include:
  - _pages

collections:
  projects:
    output: true
    sort_by: date

# Projects and posts stay hidden until each one is ready.
# Set `published: true` in a page's front matter to put it live.
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      published: false
  - scope:
      path: ""
      type: posts
    values:
      published: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# A custom exclude list replaces Jekyll's defaults, so vendor/ etc. are listed here.
exclude:
  - .gitignore
  - .bundle/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - docker-compose.yml
